name: Build and Deploy to cPanel

on:
  push:
    branches:
      - '**'
      - '!cpanel-deploy' # Ignore to prevent infinite loops

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Next.js and Trigger cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prisma Generate
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://cvacimot_usr:Strong!@#Password123@116.202.222.251:3306/cvacimot_resale"

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare cPanel Files
        run: |
          mkdir -p .deploy/app
          # Move standalone output to nested app folder (using /. to include dotfiles like .next)
          cp -a .next/standalone/. .deploy/app/
          cp -a .next/standalone/.env* .deploy/app/ 2>/dev/null || true
          
          # Copy static files Next.js needs
          mkdir -p .deploy/app/.next
          cp -r .next/static .deploy/app/.next/static
          cp -r public .deploy/app/public
          
          # Create a root server.js that simply proxies to the nested Next.js server
          # This prevents cPanel's node_modules symlink from blocking the build extraction
          echo "require('./app/server.js');" > .deploy/server.js
          
          # Create passenger restart file so cPanel reboots the app automatically
          mkdir -p .deploy/tmp
          touch .deploy/tmp/restart.txt

          # Zip everything into a single file
          cd .deploy
          zip -ry ../build.zip .

      - name: Deploy Zip to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 116.202.222.251
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASS }}
          local-dir: ./
          server-dir: /resale/
          exclude: |
            **/*
            !build.zip

      - name: Extract Zip on cPanel
        run: |
          # 1. Upload unzip.php via UAPI to the document root (so it executes as the correct user, bypassing 'nobody' cage limitations)
          curl -s -u '${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASS }}' \
          "https://116.202.222.251:2083/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=savefile&dir=/home/cvacimot/public_html/resale.cv-acimotors.com&filename=unzip.php&content=%3C%3Fphp%20%24z%3Dnew%20ZipArchive%3B%20if%28%24z-%3Eopen%28%22/home/cvacimot/resale/build.zip%22%29%3D%3D%3DTRUE%29%7B%24z-%3EextractTo%28%22/home/cvacimot/resale/%22%29%3B%24z-%3Eclose%28%29%3Becho%20%22OK%22%3B%7Delse%7Becho%20%22FAIL%22%3B%7D%20%3F%3E" -k
          
          # 2. Trigger the PHP script to extract the zip file
          curl -s "http://resale.cv-acimotors.com/unzip.php"
