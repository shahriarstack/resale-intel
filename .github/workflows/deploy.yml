name: Build and Deploy to cPanel

on:
  push:
    branches:
      - '**'
      - '!cpanel-deploy' # Ignore to prevent infinite loops

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build Next.js and Trigger cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prisma Generate
        run: npx prisma generate
        env:
          DATABASE_URL: "mysql://cvacimot_usr:Strong!@#Password123@116.202.222.251:3306/cvacimot_resale"

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare cPanel Files
        run: |
          mkdir -p .deploy
          # Move standalone output to deploy folder and resolve all symlinks (-L) so FTP doesn't crash
          cp -rL .next/standalone/* .deploy/
          cp -rL .next/standalone/.env* .deploy/ 2>/dev/null || true
          
          # Copy static files Next.js needs
          mkdir -p .deploy/.next
          cp -rL .next/static .deploy/.next/static
          cp -rL public .deploy/public
          
          # Create passenger restart file so cPanel reboots the app automatically
          mkdir -p .deploy/tmp
          touch .deploy/tmp/restart.txt

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 116.202.222.251
          username: ${{ secrets.CPANEL_USER }}
          password: ${{ secrets.CPANEL_PASS }}
          local-dir: ./.deploy/
          server-dir: /public_html/resale.cv-acimotors.com/
          exclude: |
            **/.git*
            **/.git*/**
